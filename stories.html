<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rajendra Kumar Stories</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #111;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
        }

        .story {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .story h2 {
            margin-top: 0;
        }

        .read-btn {
            display: inline-block;
            background: #111;
            color: white;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 6px;
        }
    </style>
</head>

<body>

<header>
    <h1>Rajendra Kumar Stories</h1>
    <p>Read Amazing Stories</p>
</header>

<div class="container">

    <div class="story">
        <h2>Pyar Aur Paisa</h2>
        <p>Ek interesting love story...</p>
        <a href="#" class="read-btn">Read Story</a>
    </div>

</div>

</body>
</html>
