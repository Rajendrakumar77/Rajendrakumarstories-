<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RajendraKumar Stories</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      font-size: 28px;
    }

    header p {
      margin-top: 6px;
      color: #ccc;
    }

    nav {
      background: white;
      padding: 12px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }

    nav a {
      color: #222;
      text-decoration: none;
      margin: 0 10px;
      font-weight: bold;
    }

    .container {
      max-width: 900px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .welcome {
      background: white;
      padding: 25px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .welcome h2 {
      margin-bottom: 10px;
    }

    .story {
      background: white;
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 15px;
    }

    .story h3 {
      margin-bottom: 8px;
    }

    .story p {
      color: #666;
      margin-bottom: 12px;
    }

    .read {
      display: inline-block;
      background: #111;
      color: white;
      padding: 10px 16px;
      border-radius: 7px;
      text-decoration: none;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #777;
    }
  </style>
</head>

<body>

  <header>
    <h1>RajendraKumar Stories</h1>
    <p>Read amazing stories, part by part</p>
  </header>

  <nav>
    <a href="#">Home</a>
    <a href="#">Stories</a>
    <a href="#">Latest Parts</a>
  </nav>

  <div class="container">

    <div class="welcome">
      <h2>Welcome to RajendraKumar Stories</h2>
      <p>Read your favourite stories from the first part to the last.</p>
    </div>

    <div class="story">
      <h3>Coming Soon</h3>
      <p>Our first story will be published soon.</p>
      <a class="read" href="#">Read Story</a>
    </div>

  </div>

  <footer>
    © 2026 RajendraKumar Stories
  </footer>

</body>
</html>
